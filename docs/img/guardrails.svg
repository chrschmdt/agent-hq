<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="A customer message passes the input check, the Dispatcher, the agent loop with its tool permissions and approvals, and the reply check before a reply reaches the customer. Each layer can stop an attack on its own; the input check and the reply check send the work to a person and log a guardrail event, the tools refuse, and approvals wait for a person.">
  <style>
    svg { --bg:#ffffff; --line:#e7e5e4; --ink:#1c1917; --ink2:#57534e; --muted:#78716c; --band:#fafaf9;
          --teal:#0d9488; --teal-bg:#f0fdfa; --teal-ink:#134e4a; --stone:#a8a29e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161413; --line:#2e2a27; --ink:#f5f5f4; --ink2:#a8a29e; --muted:#a8a29e; --band:#1c1917;
            --teal:#2dd4bf; --teal-bg:#0b2926; --teal-ink:#ccfbf1; --stone:#78716c; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .panel { fill: var(--bg); stroke: var(--line); }
    .band { fill: var(--band); stroke: var(--line); }
    .band-key { fill: var(--teal-bg); stroke: var(--teal); stroke-width: 1.5; }
    .row { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); }
    .chip { fill: var(--bg); stroke: var(--stone); }
    .chip-key { fill: var(--bg); stroke: var(--teal); }
    .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: var(--ink); }
    .desc { font-size: 11.5px; fill: var(--muted); }
    .edge { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
    .impl { fill: none; stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: var(--ink2); }
    .head-teal { fill: var(--teal); }
    .note { font-size: 11.5px; fill: var(--ink2); }
    .note-teal { font-size: 11.5px; fill: var(--teal); font-weight: 600; }
    .box { fill: var(--bg); stroke: var(--stone); }
    .box-key { fill: var(--teal-bg); stroke: var(--teal); stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .sub { font-size: 11px; fill: var(--muted); }
    .title { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; fill: var(--muted); }
    .skip { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .bad { fill: none; stroke: #d97706; stroke-width: 1.5; }
    .head-bad { fill: #d97706; }
    .note-bad { font-size: 11.5px; fill: #b45309; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head-teal"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head-bad"/>
    </marker>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="999" height="379" rx="16"/>
  <text class="title" x="32" y="42" text-anchor="start">THE LAYERS AN ATTACK MEETS</text>
  <rect class="box" x="24" y="110" width="120" height="62" rx="8"/>
  <text class="label" x="84.0" y="133" text-anchor="middle">customer</text>
  <text class="sub" x="84.0" y="149" text-anchor="middle">writes in</text>
  <rect class="box-key" x="184" y="110" width="150" height="62" rx="8"/>
  <text class="label" x="259.0" y="132" text-anchor="middle">input check</text>
  <text class="sub" x="259.0" y="149" text-anchor="middle">patterns, then</text>
  <text class="sub" x="259.0" y="163" text-anchor="middle">the guard model</text>
  <rect class="box" x="374" y="110" width="130" height="62" rx="8"/>
  <text class="label" x="439.0" y="133" text-anchor="middle">Dispatcher</text>
  <text class="sub" x="439.0" y="149" text-anchor="middle">routes the work</text>
  <rect class="box" x="544" y="110" width="180" height="62" rx="8"/>
  <text class="label" x="634.0" y="132" text-anchor="middle">agent loop</text>
  <text class="sub" x="634.0" y="149" text-anchor="middle">tools check identity,</text>
  <text class="sub" x="634.0" y="163" text-anchor="middle">scope and approvals</text>
  <rect class="box-key" x="764" y="110" width="140" height="62" rx="8"/>
  <text class="label" x="834.0" y="132" text-anchor="middle">reply check</text>
  <text class="sub" x="834.0" y="149" text-anchor="middle">other customers'</text>
  <text class="sub" x="834.0" y="163" text-anchor="middle">details, links</text>
  <rect class="box" x="924" y="110" width="56" height="62" rx="8"/>
  <text class="label" x="952.0" y="145.0" text-anchor="middle">reply</text>
  <path class="edge" d="M146,141.0 L180,141.0" marker-end="url(#a)"/>
  <path class="edge" d="M336,141.0 L370,141.0" marker-end="url(#a)"/>
  <path class="edge" d="M506,141.0 L540,141.0" marker-end="url(#a)"/>
  <path class="edge" d="M726,141.0 L760,141.0" marker-end="url(#a)"/>
  <path class="edge" d="M906,141.0 L920,141.0" marker-end="url(#a)"/>
  <rect class="band" x="184" y="250" width="720" height="52" rx="10"/>
  <text class="label" x="544" y="272" text-anchor="middle">a person</text>
  <text class="sub" x="544" y="289" text-anchor="middle">the customer gets a holding reply; the work waits for an operator</text>
  <path class="skip" d="M259.0,174 L259.0,246" marker-end="url(#a)"/>
  <text class="note" x="267.0" y="212" text-anchor="start">blocked: logged</text>
  <path class="skip" d="M439.0,174 L439.0,246" marker-end="url(#a)"/>
  <text class="note" x="447.0" y="212" text-anchor="start">safety, legal, press</text>
  <path class="skip" d="M634.0,174 L634.0,246" marker-end="url(#a)"/>
  <text class="note" x="642.0" y="212" text-anchor="start">refused, or waits for approval</text>
  <path class="skip" d="M834.0,174 L834.0,246" marker-end="url(#a)"/>
  <text class="note" x="842.0" y="212" text-anchor="start">held back: logged</text>
  <text class="note" x="32" y="350" text-anchor="start">The input check and the reply check are the guardrails; with the input check switched off, the safety suite shows what the layers behind it stop on their own.</text>
</svg>
