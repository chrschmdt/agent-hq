<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="pass^k on τ³ retail: pass^1 0.70, pass^2 0.60">
<style>
    svg { --bg:#ffffff; --line:#e7e5e4; --ink:#1c1917; --ink2:#57534e; --a:#99f6e4; --b:#2dd4bf; --c:#0f766e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161413; --line:#2e2a27; --ink:#f5f5f4; --ink2:#a8a29e; --a:#134e4a; --b:#0d9488; --c:#5eead4; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
           font-size: 12px; fill: var(--ink2); }
    .panel { fill: var(--bg); stroke: var(--line); }
    .grid { stroke: var(--line); }
    .best { font-weight: 700; fill: var(--ink); }
    .m0 { fill: var(--a); } .m1 { fill: var(--b); } .m2 { fill: var(--c); }
  </style>
<style>
    .l0 { fill: var(--c); } .l1 { fill: var(--b); } .l2 { fill: #0284c7; } .l3 { fill: #7c3aed; }
    .l4 { fill: #db2777; } .l5 { fill: var(--a); } .l6 { fill: #dc2626; }
    .big { font-size: 13px; font-weight: 600; fill: var(--ink); }
  </style>
<rect class="panel" x="0.5" y="0.5" width="639" height="299" rx="12"/>
<text class="big" x="56" y="24">τ³ retail, 10 test tasks, the medium lineup</text>
<line class="grid" x1="56" y1="236.0" x2="616" y2="236.0"/>
<text x="48" y="240.0" text-anchor="end">0.00</text>
<line class="grid" x1="56" y1="187.0" x2="616" y2="187.0"/>
<text x="48" y="191.0" text-anchor="end">0.25</text>
<line class="grid" x1="56" y1="138.0" x2="616" y2="138.0"/>
<text x="48" y="142.0" text-anchor="end">0.50</text>
<line class="grid" x1="56" y1="89.0" x2="616" y2="89.0"/>
<text x="48" y="93.0" text-anchor="end">0.75</text>
<line class="grid" x1="56" y1="40.0" x2="616" y2="40.0"/>
<text x="48" y="44.0" text-anchor="end">1.00</text>
<rect class="m2" x="148.0" y="98.8" width="96.0" height="137.2" rx="3"/>
<text class="big" x="196.0" y="90.8" text-anchor="middle">0.70</text>
<text x="196.0" y="256" text-anchor="middle">pass^1</text>
<rect class="m2" x="428.0" y="118.4" width="96.0" height="117.6" rx="3"/>
<text class="big" x="476.0" y="110.4" text-anchor="middle">0.60</text>
<text x="476.0" y="256" text-anchor="middle">pass^2</text>
<text x="56" y="282">pass^k: the chance that all of k tries at a task succeed, over 10 tasks</text>
</svg>
