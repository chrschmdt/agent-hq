<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 348" role="img" aria-label="Top: the event log hands out rows in ID order, but holds back a committed row while an older transaction is still open, so a reader following the cursor never skips an event. Bottom: the browser's stream closes itself before the function limit and reconnects with the last event ID; it also closes while the tab is hidden and reopens from the same cursor.">
  <style>
    svg { --bg:#ffffff; --line:#e7e5e4; --ink:#1c1917; --ink2:#57534e; --muted:#78716c;
          --teal:#0d9488; --teal-bg:#f0fdfa; --teal-ink:#134e4a; --stone:#a8a29e; --stone-bg:#fafaf9;
          --amber:#d97706; --amber-bg:#fffbeb; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161413; --line:#2e2a27; --ink:#f5f5f4; --ink2:#a8a29e; --muted:#a8a29e;
            --teal:#2dd4bf; --teal-bg:#0b2926; --teal-ink:#ccfbf1; --stone:#78716c; --stone-bg:#211e1c;
            --amber:#fbbf24; --amber-bg:#2e1f06; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .panel { fill: var(--bg); stroke: var(--line); }
    .section { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); }
    .done { fill: var(--teal-bg); stroke: var(--teal); stroke-width: 1.5; }
    .open { fill: var(--amber-bg); stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .held { fill: var(--stone-bg); stroke: var(--stone); stroke-width: 1.5; }
    .cell-t { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .note { font-size: 11.5px; fill: var(--ink2); }
    .axis { stroke: var(--stone); stroke-width: 1.5; }
    .gap { stroke: var(--stone); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .live { fill: var(--teal-bg); stroke: var(--teal); stroke-width: 1.5; }
    .dot { fill: var(--teal); }
    .beat { fill: var(--bg); stroke: var(--teal); stroke-width: 1.5; }
    .tick { stroke: var(--ink2); stroke-width: 1.2; }
    .head { fill: var(--ink2); }
    .caret { fill: var(--ink2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="999" height="347" rx="16"/>

  <text class="section" x="40" y="40">EVENT LOG, READ IN ID ORDER</text>
  <rect class="done" x="40" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="68" y="81" text-anchor="middle">1</text>
  <rect class="done" x="104" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="132" y="81" text-anchor="middle">2</text>
  <rect class="done" x="168" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="196" y="81" text-anchor="middle">3</text>
  <rect class="done" x="232" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="260" y="81" text-anchor="middle">4</text>
  <rect class="done" x="296" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="324" y="81" text-anchor="middle">5</text>
  <rect class="done" x="360" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="388" y="81" text-anchor="middle">6</text>
  <rect class="open" x="424" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="452" y="81" text-anchor="middle">7</text>
  <rect class="held" x="488" y="54" width="56" height="44" rx="8"/><text class="cell-t" x="516" y="81" text-anchor="middle">8</text>

  <path class="caret" d="M420 106 l-6 10 h12 z"/>
  <text class="note" x="420" y="136" text-anchor="middle">a reader following the cursor stops after 6 until 7 commits</text>

  <rect class="done" x="620" y="54" width="14" height="14" rx="3"/>
  <text class="note" x="642" y="65">committed and readable</text>
  <rect class="open" x="620" y="76" width="14" height="14" rx="3"/>
  <text class="note" x="642" y="87">its transaction is still open</text>
  <rect class="held" x="620" y="98" width="14" height="14" rx="3"/>
  <text class="note" x="642" y="109">committed, held back until 7 lands</text>

  <text class="section" x="40" y="186">BROWSER STREAM OVER TIME</text>
  <line class="axis" x1="40" y1="262" x2="60" y2="262"/>
  <line class="axis" x1="932" y1="262" x2="954" y2="262" marker-end="url(#arrow)"/>

  <rect class="live" x="60" y="250" width="356" height="24" rx="12"/>
  <circle class="dot" cx="92" cy="262" r="4.5"/>
  <circle class="dot" cx="120" cy="262" r="4.5"/>
  <circle class="dot" cx="148" cy="262" r="4.5"/>
  <circle class="dot" cx="176" cy="262" r="4.5"/>
  <circle class="dot" cx="204" cy="262" r="4.5"/>
  <circle class="dot" cx="232" cy="262" r="4.5"/>
  <text class="note" x="162" y="296" text-anchor="middle">events 1 to 6</text>
  <circle class="beat" cx="330" cy="262" r="4.5"/>
  <text class="note" x="330" y="296" text-anchor="middle">heartbeat</text>
  <line class="tick" x1="416" y1="230" x2="416" y2="248"/>
  <text class="note" x="412" y="224" text-anchor="end">server closes before the time limit</text>

  <line class="gap" x1="416" y1="262" x2="452" y2="262"/>

  <rect class="live" x="452" y="250" width="232" height="24" rx="12"/>
  <line class="tick" x1="452" y1="230" x2="452" y2="248"/>
  <text class="note" x="456" y="224">reconnects with <tspan class="mono">Last-Event-ID: 6</tspan></text>
  <circle class="dot" cx="490" cy="262" r="4.5"/>
  <circle class="dot" cx="518" cy="262" r="4.5"/>
  <text class="note" x="504" y="296" text-anchor="middle">7 and 8</text>

  <line class="gap" x1="684" y1="262" x2="832" y2="262"/>
  <text class="note" x="758" y="296" text-anchor="middle">tab hidden: closed</text>

  <rect class="live" x="832" y="250" width="100" height="24" rx="12"/>
  <text class="note" x="882" y="296" text-anchor="middle">reopens after 8</text>

  <rect class="live" x="40" y="316" width="28" height="14" rx="7"/>
  <text class="note" x="76" y="327">stream open</text>
  <line class="gap" x1="170" y1="323" x2="198" y2="323"/>
  <text class="note" x="206" y="327">no connection, no cost</text>
</svg>
