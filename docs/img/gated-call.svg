<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-label="A refund over the limit, across two segments. In the first segment, Support's graph finds that the refund needs approval, pauses with interrupt, and the runtime opens an approval that the operator sees in the inbox. The operator approves. A resume job starts a second segment, where the approval gate hands the decision back and the tool call goes to the orders server with a signed context carrying the approval id. The server checks the call again, confirms the approval covers exactly these arguments, and writes the change and its audit row in one transaction; a repeated delivery gets the same answer and writes nothing.">
  <style>
    svg { --bg:#ffffff; --line:#e7e5e4; --ink:#1c1917; --ink2:#57534e; --muted:#78716c; --band:#fafaf9;
          --teal:#0d9488; --teal-bg:#f0fdfa; --stone:#a8a29e; --stone-bg:#f5f5f4; --amber:#d97706; --amber-bg:#fffbeb; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#161413; --line:#2e2a27; --ink:#f5f5f4; --ink2:#a8a29e; --muted:#a8a29e; --band:#1c1917;
            --teal:#2dd4bf; --teal-bg:#0b2926; --stone:#78716c; --stone-bg:#1f1c1a; --amber:#fbbf24; --amber-bg:#2a1e05; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .panel { fill: var(--bg); stroke: var(--line); }
    .band { fill: var(--band); stroke: none; }
    .code { fill: var(--teal-bg); stroke: var(--teal); stroke-width: 1.3; }
    .platform { fill: var(--stone-bg); stroke: var(--stone); stroke-width: 1.2; }
    .person { fill: var(--amber-bg); stroke: var(--amber); stroke-width: 1.3; }
    .title { font-size: 13px; font-weight: 700; fill: var(--ink); }
    .small { font-size: 11px; fill: var(--muted); }
    .life { stroke: var(--stone); stroke-width: 1.1; stroke-dasharray: 3 5; }
    .edge { fill: none; stroke: var(--ink2); stroke-width: 1.4; }
    .back { fill: none; stroke: var(--ink2); stroke-width: 1.3; stroke-dasharray: 5 4; }
    .key { fill: none; stroke: var(--teal); stroke-width: 1.6; }
    .head { fill: var(--ink2); }
    .head-teal { fill: var(--teal); }
    .label { font-size: 11.5px; fill: var(--ink2); }
    .label-teal { font-size: 11.5px; font-weight: 600; fill: var(--teal); }
    .step { font-size: 10.5px; font-weight: 700; fill: var(--muted); }
    .note { font-size: 11.5px; fill: var(--ink); }
    .row { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; fill: var(--muted); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head-teal"/>
    </marker>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="1199" height="659" rx="16"/>
  <rect class="band" x="1" y="100" width="1198" height="200"/>
  <text class="row" x="24" y="124">SEGMENT 1</text>
  <text class="row" x="24" y="344">OPERATOR</text>
  <rect class="band" x="1" y="380" width="1198" height="254"/>
  <text class="row" x="24" y="404">SEGMENT 2</text>

  <rect class="code" x="70" y="28" width="160" height="52" rx="10"/>
  <text class="title" x="150" y="50" text-anchor="middle">Support graph</text>
  <text class="small" x="150" y="68" text-anchor="middle">worker, per segment</text>
  <rect class="code" x="290" y="28" width="160" height="52" rx="10"/>
  <text class="title" x="370" y="50" text-anchor="middle">Runtime</text>
  <text class="small" x="370" y="68" text-anchor="middle">segment runner, queue</text>
  <rect class="person" x="510" y="28" width="160" height="52" rx="10"/>
  <text class="title" x="590" y="50" text-anchor="middle">Operator</text>
  <text class="small" x="590" y="68" text-anchor="middle">approvals inbox</text>
  <rect class="platform" x="730" y="28" width="160" height="52" rx="10"/>
  <text class="title" x="810" y="50" text-anchor="middle">Orders server</text>
  <text class="small" x="810" y="68" text-anchor="middle">MCP, per caller</text>
  <rect class="platform" x="950" y="28" width="200" height="52" rx="10"/>
  <text class="title" x="1050" y="50" text-anchor="middle">Postgres</text>
  <text class="small" x="1050" y="68" text-anchor="middle">store, approvals, audit</text>

  <line class="life" x1="150" y1="80" x2="150" y2="640"/>
  <line class="life" x1="370" y1="80" x2="370" y2="640"/>
  <line class="life" x1="590" y1="80" x2="590" y2="640"/>
  <line class="life" x1="810" y1="80" x2="810" y2="640"/>
  <line class="life" x1="1050" y1="80" x2="1050" y2="640"/>

  <rect class="code" x="56" y="138" width="188" height="44" rx="8"/>
  <text class="step" x="66" y="156">1</text>
  <text class="note" x="80" y="156">authorize: refund $249.01</text>
  <text class="note" x="80" y="172">is over the $100 limit</text>

  <path class="edge" d="M150 214 H366" marker-end="url(#arrow)"/>
  <text class="step" x="160" y="206">2</text>
  <text class="label" x="174" y="206">interrupt(): request, checkpoint</text>

  <path class="edge" d="M370 262 H1046" marker-end="url(#arrow)"/>
  <text class="step" x="380" y="254">3</text>
  <text class="label" x="394" y="254">approval row opened; the work item waits; the segment ends</text>

  <path class="edge" d="M590 350 H374" marker-end="url(#arrow)"/>
  <text class="step" x="600" y="342">4</text>
  <text class="label" x="614" y="342">approve, edit or reject; a resume job is queued</text>

  <path class="edge" d="M370 424 H154" marker-end="url(#arrow)"/>
  <text class="step" x="220" y="416">5</text>
  <text class="label" x="234" y="416">ApprovalResume</text>

  <rect class="code" x="56" y="440" width="188" height="44" rx="8"/>
  <text class="step" x="66" y="458">6</text>
  <text class="note" x="80" y="458">approval_gate re-runs;</text>
  <text class="note" x="80" y="474">interrupt() returns it</text>

  <path class="key" d="M150 510 H806" marker-end="url(#arrow-teal)"/>
  <text class="step" x="160" y="502">7</text>
  <text class="label-teal" x="174" y="502">execute_tools: the call, with a signed ctx (verified customer, approval id)</text>

  <path class="key" d="M810 556 H1046" marker-end="url(#arrow-teal)"/>
  <text class="step" x="820" y="548">8</text>
  <text class="label-teal" x="834" y="548">decide again; approval covers</text>
  <text class="label" x="834" y="578">change and audit row in one</text>
  <text class="label" x="834" y="594">transaction, keyed by the call</text>

  <path class="back" d="M810 616 H154" marker-end="url(#arrow)"/>
  <text class="step" x="220" y="608">9</text>
  <text class="label" x="234" y="608">the order, as τ³ returns it; a repeated delivery gets the same answer and writes nothing</text>
</svg>
